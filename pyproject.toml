[project]
name = "wyzectl"
version = "0.2.0"
description = "Control Wyze lights and plugs from the command line or an MCP client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
    "wyze-sdk==2.3.9",
    "mcp>=1.12,<2",
]

[project.scripts]
wyzectl = "wyzectl.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wyzectl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
